semantic_models:
  - name: "marketing-demo"
    namespace: "demo"
    label: "Marketing Analytics Demo"
    description: "Demo semantic model showing UNION across datasetGroups"
    contract:
      mode: strict

    # Virtual dimension for table metadata
    dimensions:
      - name: _dataset
        virtual: true
        label: "Dataset Metadata"
        description: "Metadata about the dataset and model"
        attributes:
          - name: model
            type: string
          - name: namespace
            type: string
          - name: datasetGroup
            type: string
          - name: dataset
            type: string

      # Grain dimensions for diff analysis
      - name: dates
        label: "Date Dimensions"
        description: "Date-based grouping dimensions"
        attributes:
          - name: day
            type: string
            label: "Day"
            description: "Date in YYYY-MM-DD format"

      - name: accounts
        label: "Account Dimensions"
        description: "Account-based grouping dimensions"
        attributes:
          - name: id
            type: i64
            label: "Account ID"
            description: "Account identifier"

      - name: campaigns
        label: "Campaign Dimensions"
        description: "Campaign-based grouping dimensions"
        attributes:
          - name: id
            type: i64
            label: "Campaign ID"
            description: "Campaign identifier"
            scopedBy: ["accounts.id"]

      - name: ads
        label: "Ad Dimensions"
        description: "Ad-based grouping dimensions"
        attributes:
          - name: id
            type: i64
            label: "Ad ID"
            description: "Ad identifier"
            scopedBy: ["campaigns.id"]

      - name: users
        label: "User Dimensions"
        description: "User-based dimensions for distinct counting"
        attributes:
          - name: id
            type: i64
            label: "User ID"
            description: "User identifier"

    datasetGroups:
      # AdWords tableGroup
      - name: adwords
        label: "AdWords Campaigns"
        dimensions:
          - name: _dataset
          - name: dates
          - name: accounts
          - name: campaigns
            join:
              leftKey: account_id
              rightKey: id
              relationship: many_to_one
          - name: ads
            join:
              leftKey: campaign_id
              rightKey: id
              relationship: many_to_one
        measures:
          - name: cost
            aggregation: sum
            expr: cost
            type: f64
            label: "AdWords Cost"
          - name: impressions
            aggregation: sum
            expr: impressions
            type: i64
            label: "AdWords Impressions"
          - name: user_id
            aggregation: count_distinct
            expr: user_id
            type: i64
            label: "AdWords Unique Users"
        datasets:
          - dataset: "adwords_campaigns"
            source:
              type: parquet
              path: "/tmp/adwords_campaigns.parquet"  # Will be overridden in demo
            grain: ["dates.day", "accounts.account_id", "campaigns.campaign_id", "ads.ad_id"]
            dimensions:
              _dataset: [model, namespace, datasetGroup, dataset]
              dates: [day]
              accounts: [account_id]
              campaigns: [campaign_id]
              ads: [ad_id]
              users: [user_id]
            measures: [cost, impressions, user_id]

      # Facebook tableGroup
      - name: facebook
        label: "Facebook Campaigns"
        dimensions:
          - name: _dataset
          - name: dates
          - name: accounts
          - name: campaigns
            join:
              leftKey: account_id
              rightKey: id
              relationship: many_to_one
          - name: ads
            join:
              leftKey: campaign_id
              rightKey: id
              relationship: many_to_one
        measures:
          - name: spend
            aggregation: sum
            expr: spend
            type: f64
            label: "Facebook Spend"
          - name: impressions
            aggregation: sum
            expr: impressions
            type: i64
            label: "Facebook Impressions"
          - name: user_id
            aggregation: count_distinct
            expr: user_id
            type: i64
            label: "Facebook Unique Users"
        datasets:
          - dataset: "facebook_campaigns"
            source:
              type: parquet
              path: "/tmp/facebook_campaigns.parquet"  # Will be overridden in demo
            grain: ["dates.day", "accounts.account_id", "campaigns.campaign_id", "ads.ad_id"]
            dimensions:
              _dataset: [model, namespace, datasetGroup, dataset]
              dates: [day]
              accounts: [account_id]
              campaigns: [campaign_id]
              ads: [ad_id]
              users: [user_id]
            measures: [spend, impressions, user_id]

    metrics:
      # Total cost metric that combines adwords.cost and facebook.spend
      - name: total_cost
        type: f64
        label: "Total Marketing Cost"
        description: "Combined cost across all marketing channels"
        expr:
          case:
            when:
              - condition:
                  eq: [datasetGroup.name, "adwords"]
                then: cost
              - condition:
                  eq: [datasetGroup.name, "facebook"]
                then: spend
            else: 0

      # Total impressions metric
      - name: total_impressions
        type: i64
        label: "Total Impressions"
        description: "Combined impressions across all marketing channels"
        expr:
          case:
            when:
              - condition:
                  eq: [datasetGroup.name, "adwords"]
                then: impressions
              - condition:
                  eq: [datasetGroup.name, "facebook"]
                then: impressions
            else: 0

      # Total unique users metric
      - name: total_unique_users
        type: i64
        label: "Total Unique Users"
        description: "Combined unique users across all marketing channels"
        expr:
          case:
            when:
              - condition:
                  eq: [datasetGroup.name, "adwords"]
                then: user_id
              - condition:
                  eq: [datasetGroup.name, "facebook"]
                then: user_id
            else: 0

